name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anjalitalan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#FA98C5&color_dots=#F8EEE4,#BDEDE5,#50C7B7,#FA98C5,#39233E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FA98C5&color_dots=#161B22,#BDEDE5,#50C7B7,#FA98C5,#39233E

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
