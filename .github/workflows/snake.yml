name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anjalitalan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FA98C5&color_dots=%23F8EEE4,%23BDEDE5,%2350C7B7,%23FA98C5,%2339233E
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FA98C5&color_dots=%230D1117,%23BDEDE5,%2350C7B7,%23FA98C5,%2339233E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
