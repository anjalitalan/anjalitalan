name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: anjalitalan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23FFA8CB&color_dots=%230D1117,%2351C9B3,%23FFA8CB,%2351C9B3,%23FFA8CB

      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
